{% load static %}

<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Login</title>
        
        <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
    </head>

    <body>
        
        <header>
            <h1>Login</h1>
        </header>

        <main>

            <div class="form-container">

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit">
                        Login
                    </button>

                </form>

                <a class="back-link" href="{% url 'register' %}">
                    Create an account
                </a>

            </div>

        </main>

    </body>
</html>
